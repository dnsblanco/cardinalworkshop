<style>
  :root { --space: clamp(1.5rem, 4vw, 2.5rem); }
  body { margin: 0; background: #fff; }
  img { display: block; max-width: 100%; margin: 0 auto; }

  header { padding: var(--space) 0; }
  header img { width: clamp(200px, 27.5vw, 375px); }

  .hero { display: flex; width: 85%; margin: 0 auto var(--space); }
  .hero > div:first-child { flex: 2; }
  .hero img { width: 100%; }
  .intro { flex: 1; display: flex; flex-direction: column; padding: clamp(1.5rem, 3vw, 2.5rem); font: 1.125rem/1.6 Georgia, serif; color: #1f2a1f; background: #B0E3E8; }
  .intro p { margin: auto 0; }
  .intro a { color: #42416B; }
  .hero .intro img { width: clamp(120px, 14vw, 200px); margin-top: 1.5rem; }
  .hero.flip { flex-direction: row-reverse; }
  .flip .intro { background: #42416B; color: #F4F1EA; }
  @media (max-width: 700px) { .hero, .hero.flip { flex-direction: column; } }

  h2 { width: 85%; margin: clamp(1.5rem, 4vw, 2.5rem) auto 0; text-align: center; font: 1.75rem Georgia, serif; color: #1f2a1f; }
  section { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem clamp(0.8rem, 2vw, 1.5rem); width: 85%; margin: 0 auto var(--space); }
  @media (max-width: 700px) { section { grid-template-columns: 1fr; } }
  figure { margin: 0; }
  figure img { width: 100%; }
  .reveal { position: relative; }
  .reveal img + img { position: absolute; inset: 0; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.4s ease; }
  .reveal:hover img + img, .reveal:focus img + img { opacity: 1; }
  .divider { width: 85%; margin: 0 auto var(--space); background: #B0E3E8; }
  .divider img { width: clamp(120px, 14vw, 200px); }
  section.team { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 700px) { section.team { grid-template-columns: 1fr; } }
  .team img { cursor: zoom-in; }
  .lightbox { padding: 0; border: 0; background: none; max-width: 92vw; max-height: 92vh; }
  .lightbox::backdrop { background: rgba(0, 0, 0, 0.85); }
  .lightbox img { max-width: 92vw; max-height: 92vh; cursor: zoom-out; }

  footer { padding: 0 0 var(--space); text-align: center; font: 0.875rem Georgia, serif; color: #1f2a1f; }
  footer p { margin: 0; }
  footer a { color: #42416B; }
</style>
</head>

    <img src="https://github.com/dnsblanco/cardinalworkshop/blob/main/img/tree.png?raw=true" alt="Tree">
  </div>
</div>

<dialog class="lightbox"><img alt=""></dialog>

<script>
  const box = document.querySelector('.lightbox'), big = box.querySelector('img');
  document.querySelectorAll('.team img').forEach(img => {
    const open = () => { big.src = img.src; big.alt = img.alt; box.showModal(); };
    img.tabIndex = 0;
    img.addEventListener('click', open);
    img.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
  });
  box.addEventListener('click', () => box.close());
</script>
